name: Incorporar midias e PDF da NECCOS
on:
  push:
    paths:
      - .github/workflows/incorporar-midias.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet reportlab Pillow
      - name: Recuperar recursos originais e gerar apresentacao
        run: python scripts/sincronizar_midias.py
      - name: Versionar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets assets website/index.html README.md APRESENTACAO-PARCEIROS.pdf
          if ! git diff --cached --quiet; then
            git commit -m "assets: incorporar imagens e apresentacao PDF da NECCOS"
            git push
          fi
